[project]
name = "primes"
version = "0.1.0"
description = "Last-digit patterns of consecutive primes"
readme = "README.md"
requires-python = ">=3.14.8"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "primesieve>=2.3",
]

[project.optional-dependencies]
dev = ["ipdb", "mypy", "ruff"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prime"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["*_test.py"]
